name: Deploy to VPS Servers

on:
  push:
    branches:
      - main # ← МЕНЯЕШЬ ТОЛЬКО ЭТО

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 2
      matrix:
        vps:
          - name: HOSTKEY
            host: FTP_HOST_HOSTKEY
            user: FTP_USER_HOSTKEY
            pass: FTP_PASSWORD_HOSTKEY
          - name: PRIMA
            host: FTP_HOST_PRIMA
            user: FTP_USER_PRIMA
            pass: FTP_PASSWORD_PRIMA
